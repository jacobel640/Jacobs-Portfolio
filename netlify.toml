# Build settings are pinned here rather than left to the dashboard, so a clone
# of this repo deploys identically. dist/ is no longer committed, so Netlify
# must build it.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Hashed filenames from the Vite build are safe to cache indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Screenshots are content-addressed by path, not by hash, so keep them
# revalidating rather than pinned for a year.
[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
