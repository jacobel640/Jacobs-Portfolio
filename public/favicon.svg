<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" role="img" aria-label="Jacob Elcharar">
  <!-- The navbar brand mark, one to one: a 36-unit circle (the navbar's w-9)
       holding lucide-react's Code2 glyph at 20 units (w-5) with the same
       strokeWidth of 2.5, so the chevrons, the slash and their weights keep
       exactly the proportions the site shows. Colours are the brand scheme's
       primary / on-primary roles (src/theme/color.ts, seed #1a73e8); a static
       file cannot read the CSS variables, so they are copied here.
       `npm run brand` re-renders the PNG fallbacks from this file. -->
  <circle cx="18" cy="18" r="18" fill="#adc7ff"/>
  <g transform="translate(8 8) scale(0.8333)"
     fill="none" stroke="#0f2f60" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 16 4-4-4-4"/>
    <path d="m6 8-4 4 4 4"/>
    <path d="m14.5 4-5 16"/>
  </g>
</svg>
