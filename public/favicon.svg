<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jacob Elcharar">
  <!-- Matches the navbar brand mark: a circle in the brand scheme's
       primary-container role carrying lucide-react's Code2 glyph in
       on-primary-container. The two values are what src/theme/color.ts
       generates from BRAND_SEED (#1a73e8); a static file cannot read the
       CSS variables, so they are copied here and must follow the seed. -->
  <circle cx="32" cy="32" r="32" fill="#2a4678"/>
  <g transform="translate(16 16) scale(1.3333)"
     fill="none" stroke="#d8e2ff" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 16 4-4-4-4"/>
    <path d="m6 8-4 4 4 4"/>
    <path d="m14.5 4-5 16"/>
  </g>
</svg>
