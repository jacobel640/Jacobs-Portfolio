<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jacob Elcharar">
  <!-- Matches the navbar brand mark exactly: a rounded square with Tailwind's
       bg-gradient-to-tr from-blue-600 via-indigo-500 to-purple-600, carrying
       lucide-react's Code2 glyph. Radius and glyph size keep the same ratios
       as the 32px navbar mark (rounded-xl, w-4 h-4). -->
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="64" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="24" fill="url(#brand)"/>
  <g transform="translate(16 16) scale(1.3333)"
     fill="none" stroke="#fff" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 16 4-4-4-4"/>
    <path d="m6 8-4 4 4 4"/>
    <path d="m14.5 4-5 16"/>
  </g>
</svg>
